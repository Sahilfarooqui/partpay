services:
  - type: web
    name: partpay
    runtime: static
    staticPublishPath: .
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=300
      - path: /sw.js
        name: Cache-Control
        value: no-cache
